name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: './backend/package-lock.json'

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci || npm install

      - name: Run Smoke Tests
        env:
          JWT_SECRET: test_jwt_secret_key_ci
          GROQ_MODEL: openai/gpt-oss-20b
          # Add a dummy database URL so the server doesn't crash on boot!
          DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy
        run: |
          cd backend
          
          # 1. Start the server in the background (&) using development mode so it opens the port
          NODE_ENV=development node server.js &
          
          # 2. Wait 3 seconds for the server to fully boot up
          sleep 3
          
          # 3. Run your smoke test
          npm run test