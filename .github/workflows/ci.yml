name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: './backend/package-lock.json'

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci || npm install

      - name: Run Smoke Tests
        env:
          NODE_ENV: test
          JWT_SECRET: test_jwt_secret_key_ci
          GROQ_MODEL: openai/gpt-oss-20b
        run: |
          cd backend
          npm run test