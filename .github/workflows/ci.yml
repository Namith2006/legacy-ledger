name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: './backend/package-lock.json'

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci || npm install

      - name: Run Smoke Tests
        env:
          JWT_SECRET: test_jwt_secret_key_ci
          GROQ_MODEL: openai/gpt-oss-20b
          DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy
          GROQ_API_KEY: dummy_groq_api_key_for_ci_testing
        run: |
          cd backend
          
          # Start the server in the background so it can receive the ping
          NODE_ENV=development node server.js &
          
          # Wait 3 seconds for the server to fully boot up
          sleep 3
          
          # Run the actual smoke test
          npm run test